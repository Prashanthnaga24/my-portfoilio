# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

# AI chat: netlify/functions/chat.mjs is served at /api/chat.
# Needs the environment variable GROQ_API_KEY (Site configuration -> Environment variables).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# three.js and images rarely change: let browsers cache them for a week
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
